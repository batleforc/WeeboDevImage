schemaVersion: 2.3.0
metadata:
  name: WeeboDevImageDesktop

components:
- name: tools
  container:
    image: ghcr.io/batleforc/weebodevimage/che-mise-webkit:main
    memoryLimit: 8Gi
    memoryRequest: 1Gi
    cpuLimit: "2"
    cpuRequest: "500m"
    mountSources: true
    endpoints:
    - name: base
      targetPort: 5437
      exposure: public
      protocol: https
      secure: true
    env:
    - name: ENV
      value: "dev-che"
    - name: "PORT"
      value: "5437"
- name: desktop
  container:
    image: ghcr.io/batleforc/weebodevimage/che-desktop:main
    memoryLimit: 4Gi
    memoryRequest: 1Gi
    cpuLimit: "2"
    cpuRequest: 500m
    # the app under test is built in tools and launched from the shared /projects
    mountSources: true
    env:
    # e.g. "/projects/myapp/src-tauri/target/release/myapp"; empty = xterm
    - name: DESKTOP_APP_CMD
      value: ""
    endpoints:
    - name: novnc
      targetPort: 6082
      exposure: public
      protocol: https
      secure: true
