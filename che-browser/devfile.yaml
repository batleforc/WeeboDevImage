schemaVersion: 2.3.0
metadata:
  name: WeeboDevImageBrowser

components:
- name: tools
  container:
    image: ghcr.io/batleforc/weebodevimage/che-min-mise:main
    memoryLimit: 8Gi
    memoryRequest: 1Gi
    cpuLimit: "2"
    cpuRequest: "500m"
    mountSources: true
    endpoints:
    - name: base
      targetPort: 5437
      exposure: public
      protocol: https
      secure: true
    env:
    - name: ENV
      value: "dev-che"
    - name: "PORT"
      value: "5437"
- name: browser
  container:
    image: ghcr.io/batleforc/weebodevimage/che-browser:main
    memoryLimit: 3Gi
    memoryRequest: 1Gi
    cpuLimit: "2"
    cpuRequest: 500m
    # sources are shared so Chrome can open file:///projects/… and tests can
    # exchange files with the tools container
    mountSources: true
    env:
      - name: NO_START
        value: "true"
    endpoints:
    - name: novnc
      targetPort: 6080
      exposure: public
      protocol: https
      secure: true
    - name: cdp
      targetPort: 9222
      exposure: internal
      protocol: http
    - name: webdriver
      targetPort: 9515
      exposure: internal
      protocol: http
