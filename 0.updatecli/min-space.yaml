name: Upgrade MinSpace

scms:
  default:
    kind: github
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      owner: batleforc
      repository: WeeboDevImage
      token: "{{ requiredEnv .github.token }}"
      username: "{{ .github.username }}"
      branch: main

sources:
  kubectl:
    kind: http
    spec:
      url: "https://dl.k8s.io/release/stable.txt"
  batlehub_cli:
    kind: githubrelease
    spec:
      owner: batleforc
      repository: batlehub
      token: "{{ requiredEnv .github.token }}"
      username: "{{ .github.username }}"
      versionFilter:
        kind: semver
  starship:
    kind: githubrelease
    spec:
      owner: starship
      repository: starship
      token: "{{ requiredEnv .github.token }}"
      username: "{{ .github.username }}"
      versionFilter:
        kind: semver
  chezmoi:
    kind: githubrelease
    spec:
      owner: twpayne
      repository: chezmoi
      token: "{{ requiredEnv .github.token }}"
      username: "{{ .github.username }}"
      versionFilter:
        kind: semver

targets:
  bump_kubectl_version:
    kind: yaml
    name: "Bump kubectl version"
    scmid: default
    sourceid: kubectl
    spec:
      file: versions.yaml
      key: $.min.kubectl
  bump_batlehub_cli_version:
    kind: yaml
    name: "Bump batlehub-cli version"
    scmid: default
    sourceid: batlehub_cli
    spec:
      file: versions.yaml
      key: $.min.batlehub_cli
  bump_starship_version:
    kind: yaml
    name: "Bump starship version"
    scmid: default
    sourceid: starship
    spec:
      file: versions.yaml
      key: $.min.starship
  bump_chezmoi_version:
    kind: yaml
    name: "Bump chezmoi version"
    scmid: default
    sourceid: chezmoi
    spec:
      file: versions.yaml
      key: $.min.chezmoi

actions:
  bump_min_space:
    kind: github/pullrequest
    scmid: default
    spec:
      title: 'ci: Bump Min Space'
      automerge: false
