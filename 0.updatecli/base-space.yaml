name: Upgrade BaseSpace

scms:
  default:
    kind: github
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      owner: batleforc
      repository: WeeboDevImage
      token: "{{ requiredEnv .github.token }}"
      username: "{{ .github.username }}"
      branch: main

sources:
  kubedock:
    kind: githubrelease
    scmid: default
    spec:
      owner: joyrex2001
      repository: kubedock
      token: "{{ requiredEnv .github.token }}"
      username: "{{ .github.username }}"
      versionFilter:
        kind: semver
    transformers:
    - trimprefix: "v"
  mise:
    kind: githubrelease
    scmid: default
    spec:
      owner: jdx
      repository: mise
      token: "{{ requiredEnv .github.token }}"
      username: "{{ .github.username }}"
      versionFilter:
        kind: latest

targets:
  bump_kubedock_version:
    kind: yaml
    name: "Bump kubedock version"
    scmid: default
    sourceid: kubedock
    spec:
      file: versions.yaml
      key: $.base_tools.kubedock
  bump_mise_version:
    kind: yaml
    name: "Bump mise version"
    scmid: default
    sourceid: mise
    spec:
      file: versions.yaml
      key: $.base_tools.mise

actions:
  bump_base_space:
    kind: github/pullrequest
    scmid: default
    spec:
      title: 'ci: Bump Base Space'
      automerge: false
